<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- CONFIGURATION PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tricot Cats">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="tricot-removebg-preview.png">
    <link rel="apple-touch-icon" href="tricot-removebg-preview.png">
    
    <title>Tricot Design</title>
    <style>
        /* --- MODERN DESIGN SYSTEM --- */
        :root { 
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #bb86fc; 
            --primary-glow: rgba(187, 134, 252, 0.4);
            --secondary: #03dac6; 
            --alert: #cf6679; 
            --text: #ffffff; 
            --text-dim: rgba(255, 255, 255, 0.6);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            
            /* COULEURS DES BARRES */
            --bar-fill: linear-gradient(90deg, #8E2DE2, #4A00E0);
            
            /* LE VRAI DORÉ */
            --bar-action: linear-gradient(135deg, #d4af37 0%, #edc967 50%, #d4af37 100%);
            --gold-glow: rgba(212, 175, 55, 0.5);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            height: 100dvh; 
            display: flex; flex-direction: column; 
            overflow: hidden; user-select: none; 
        }

        /* --- ANIMATIONS --- */
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- STRUCTURE --- */
        .screen { 
            display: none; height: 100%; flex-direction: column; padding: 20px; 
            padding-top: calc(env(safe-area-inset-top) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 30px);
            animation: slideIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .screen.active { display: flex; }

        /* --- TYPOGRAPHIE & UI --- */
        h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        h1 { font-size: 2rem; background: linear-gradient(to right, #fff, #bb86fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        button { 
            border: none; border-radius: var(--radius-md); font-weight: 600; font-size: 1rem; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: all 0.2s ease; 
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.96); }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), #9a67ea); 
            color: #000; padding: 16px; 
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .btn-secondary { 
            background: var(--glass); border: 1px solid var(--glass-border); color: var(--primary); padding: 12px 16px; 
        }
        .btn-neutral { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-dim); padding: 12px; 
        }
        .btn-danger {
            background: rgba(207, 102, 121, 0.15); border: 1px solid rgba(207, 102, 121, 0.3); color: var(--alert); padding: 12px; 
        }
        
        .header-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 20px; margin-bottom: 10px; 
        }

        /* --- CARDS (GLASSMORPHISM) --- */
        .scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding: 5px; min-height: 0; }
        
        .folder-card, .part-card { 
            background: var(--glass); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 20px; border-radius: var(--radius-lg); 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--glass-border);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .folder-card:active, .part-card:active { background: rgba(255,255,255,0.12); transform: scale(0.98); }
        
        .folder-info h3 { font-size: 1.2rem; margin-bottom: 4px; color: white; }
        .folder-info span { color: var(--text-dim); font-size: 0.9rem; font-weight: 500; }
        
        /* --- COMPTEUR MODERNE --- */
        #main-click-zone { 
            flex: 2; 
            background: rgba(255,255,255,0.03); 
            border-radius: 32px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border: 1px solid var(--glass-border); 
            margin-bottom: 20px; position: relative; overflow: hidden; 
            box-shadow: inset 0 0 40px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        #main-click-zone:active { transform: scale(0.98); background: rgba(255,255,255,0.06); border-color: var(--primary); }
        
        #counter-display { 
            font-size: 8rem; font-weight: 800; line-height: 1; 
            background: linear-gradient(to bottom, #fff, #ccc); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }
        #counter-part-name { font-size: 1.5rem; margin-top: 10px; opacity: 0.9; }
        #counter-folder-name { text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; opacity: 0.5; margin-bottom: 5px; }

        /* --- SATELLITES (REGLES) --- */
        #satellites-area { 
            flex: 1.5; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; 
            padding: 5px; min-height: 0; 
        }
        .satellite-row { 
            background: rgba(0,0,0,0.2); border-radius: var(--radius-md); padding: 15px; 
            position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .progress-bar-bg { 
            position: absolute; top: 0; bottom: 0; left: 0; 
            background: var(--bar-fill); 
            opacity: 0.4; z-index: 0; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .progress-bar-bg.alert { 
            background: var(--bar-action); 
            opacity: 0.9; 
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .satellite-content { position: relative; z-index: 1; display: flex; width: 100%; justify-content: space-between; font-weight: 600; font-size: 0.95rem; }

        /* --- LOGO & INDICATEURS --- */
        .app-logo { 
            display: block; margin: 0 auto 20px auto; max-width: 160px; height: auto; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); 
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #sync-status { 
            position: fixed; top: max(15px, env(safe-area-inset-top) + 15px); right: 20px; 
            width: 12px; height: 12px; border-radius: 50%; background: #555; 
            border: 2px solid rgba(255,255,255,0.2); 
            z-index: 9999; transition: all 0.3s; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #sync-status.syncing { background: #D4AF37; box-shadow: 0 0 10px #D4AF37; border-color: #fff; animation: pulse 1s infinite; }
        #sync-status.synced { background: #27ae60; box-shadow: 0 0 10px #27ae60; border-color: #fff; }
        #sync-status.error { background: #eb5757; border-color: white; }

        /* --- MODALS MODERNES --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; 
            animation: fadeIn 0.2s ease;
        }
        .modal-box { 
            background: #1e1e1e; width: 100%; max-width: 380px; 
            border-radius: var(--radius-lg); padding: 30px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(20px); animation: slideIn 0.3s forwards;
        }
        input, select { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            color: white; padding: 15px; border-radius: var(--radius-sm); font-size: 1.1rem; margin: 15px 0 25px 0; 
            transition: border 0.2s;
        }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        /* --- NOTIFICATIONS & ALERTS --- */
        #toast { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px);
            color: white; padding: 12px 24px; border-radius: 50px; 
            font-weight: 600; font-size: 0.9rem; 
            z-index: 3000; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        #flash-alert { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: linear-gradient(135deg, #4a006a, #2a0040); 
            backdrop-filter: blur(5px);
            color: white; 
            display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 2000; text-align: center; padding: 30px; 
        }
        #flash-message { font-size: 3rem; font-weight: 800; margin-bottom: 40px; line-height: 1.2; }
        
        #flash-btn { 
            background: rgba(255,255,255,0.2);
            color: white; 
            border: 1px solid rgba(255,255,255,0.4);
            padding: 20px 50px; border-radius: 40px; font-size: 1.2rem;
            backdrop-filter: blur(10px);
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-md);
            height: 80px; margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <!-- INDICATEUR DE SYNCHRO -->
    <div id="sync-status" title="État de la synchro"></div>

    <!-- ECRAN 1: ACCUEIL -->
    <div id="screen-home" class="screen active">
        <img src="tricot-removebg-preview.png" alt="Logo Chats Tricot" class="app-logo">
        
        <div class="header-bar">
            <h1>Mes Projets</h1>
            <button class="btn-primary" onclick="openModal('modal-create-folder')" style="width: 45px; height: 45px; padding: 0; font-size: 1.5rem; border-radius: 50%; box-shadow: 0 5px 15px var(--primary-glow);">+</button>
        </div>
        
        <div id="loading-msg" style="margin-top:20px;">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
        
        <div id="error-box" style="display:none; background: rgba(207, 102, 121, 0.1); border: 1px solid var(--alert); padding: 20px; border-radius: var(--radius-md); text-align: center;">
            <strong id="error-title" style="color:var(--alert); font-size: 1.1rem;">Erreur</strong><br>
            <span id="error-desc" style="color:white; font-size: 0.9rem; display:block; margin: 10px 0;">Description</span>
            <button class="btn-secondary" onclick="fetchData()" style="width:100%; margin-top:10px;">Réessayer</button>
        </div>
        
        <div id="folders-list" class="scroll-area"></div>
    </div>

    <!-- ECRAN 2: DOSSIER -->
    <div id="screen-folder" class="screen">
        <div class="header-bar">
            <button class="btn-secondary" onclick="goHome()" style="border-radius: 50%; width: 40px; height: 40px; padding:0;">←</button>
            <h2 id="folder-title-display" style="font-size: 1.3rem; opacity: 0.9;">Titre</h2>
            <button class="btn-primary" onclick="openModal('modal-create-part')" style="border-radius: 50%; width: 40px; height: 40px; padding:0;">+</button>
        </div>
        <div id="parts-list" class="scroll-area"></div>
    </div>

    <!-- ECRAN 3: COMPTEUR -->
    <div id="screen-counter" class="screen">
        <div class="header-bar">
            <button class="btn-secondary" onclick="goBackToFolder()" style="border-radius: 50%; width: 40px; height: 40px; padding:0;">←</button>
            <div style="text-align:center">
                <div id="counter-folder-name">PROJET</div>
                <div id="counter-part-name" style="font-weight:700;">Morceau</div>
            </div>
            <button class="btn-secondary" onclick="openModal('modal-rule')" style="border-radius: 50%; width: 40px; height: 40px; padding:0;">⚙️</button>
        </div>
        
        <div id="main-click-zone" onclick="increment()">
            <div id="counter-display">0</div>
            <div style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.5; margin-top: 10px;">Rangs</div>
        </div>
        
        <div id="satellites-area"></div>
        
        <div style="display: flex; gap: 15px; margin-top: 20px; flex-shrink: 0;">
            <button class="btn-neutral" style="flex:1" onclick="decrement()">-1 (Correction)</button>
            <button class="btn-secondary" style="flex:1" onclick="openDuplicateModal()">👯 Symétrie</button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="modal-create-folder" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-bottom:5px">Nouveau Projet</h3>
            <p style="opacity:0.6; font-size:0.9rem; margin-bottom:20px">Ex: Pull Irlandais, Echarpe...</p>
            <input type="text" id="input-folder-name" placeholder="Nom du projet...">
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" style="flex:1" onclick="closeModals()">Annuler</button>
                <button class="btn-primary" style="flex:1" onclick="createFolder()">Créer</button>
            </div>
        </div>
    </div>
    
    <div id="modal-create-part" class="modal-overlay">
        <div class="modal-box">
            <h3>Ajouter un morceau</h3>
            <input type="text" id="input-part-name" placeholder="Ex: Manche Gauche">
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" style="flex:1" onclick="closeModals()">Annuler</button>
                <button class="btn-primary" style="flex:1" onclick="createPart()">Ajouter</button>
            </div>
        </div>
    </div>
    
    <div id="modal-duplicate-part" class="modal-overlay">
        <div class="modal-box">
            <h3>Symétrie</h3>
            <p style="color:var(--text-dim); font-size:0.9rem; margin: 10px 0 20px 0; line-height:1.5">Crée une copie parfaite des règles pour l'autre côté, avec le compteur à zéro.</p>
            <input type="text" id="input-duplicate-name">
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" style="flex:1" onclick="closeModals()">Annuler</button>
                <button class="btn-primary" style="flex:1" onclick="executeDuplication()">Valider</button>
            </div>
        </div>
    </div>
    
    <div id="modal-rule" class="modal-overlay">
        <div class="modal-box">
            <h3>Ajouter Règle</h3>
            <select id="input-rule-type">
                <option value="modulo">Répétition (Tous les X rangs)</option>
                <option value="target">Objectif (Au rang X)</option>
            </select>
            <input type="number" id="input-rule-val" placeholder="Nombre (ex: 6)">
            <input type="text" id="input-rule-name" placeholder="Nom (ex: Torsade)">
            <button class="btn-primary" style="width:100%" onclick="addRule()">Ajouter la règle</button>
            <div style="border-top:1px solid var(--glass-border); margin-top:20px; padding-top:15px; max-height:150px; overflow-y:auto;" id="rules-list-preview"></div>
            <button class="btn-secondary" style="width:100%; margin-top:10px" onclick="closeModals()">Fermer</button>
        </div>
    </div>
    
    <div id="flash-alert" onclick="this.style.display='none'">
        <div id="flash-message">ALERTE</div>
        <button id="flash-btn">C'est noté !</button>
    </div>
    
    <div id="toast">Info</div>

<script>
    // --- CONFIGURATION ---
    const API_URL = "https://script.google.com/macros/s/AKfycbwO5NXC4tNO2oHi-q_zawF9kNu1b1TOym2jU4ifp6KK9T0rnR2AW2ivk0BR6KGVKSoT/exec";

    let data = [];
    let activeFolderId = null;
    let activePartId = null;
    let saveTimeout = null;

    // --- UTILITAIRES ---
    function setSyncStatus(status) {
        document.getElementById('sync-status').className = status;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function openModal(id) {
        const m = document.getElementById(id);
        m.style.display = 'flex';
        if (id === 'modal-rule') renderRulesPreview();
    }

    function closeModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // --- NAVIGATION ---
    function goHome() {
        activeFolderId = null;
        activePartId = null;
        showScreen('screen-home');
    }

    function goBackToFolder() {
        activePartId = null;
        showScreen('screen-folder');
        renderParts();
    }

    // --- FETCH & SAVE ---
    async function fetchData() {
        setSyncStatus('syncing');
        const loadMsg = document.getElementById('loading-msg');
        const errBox = document.getElementById('error-box');
        
        loadMsg.style.display = 'block';
        errBox.style.display = 'none';

        try {
            const urlWithCacheBust = API_URL + "?t=" + new Date().getTime();
            const res = await fetch(urlWithCacheBust);
            if (!res.ok) throw new Error(`Erreur HTTP ${res.status}`);
            const text = await res.text();
            try {
                const json = JSON.parse(text);
                data = json;
                setSyncStatus('synced');
                loadMsg.style.display = 'none';
                renderFolders();
            } catch (jsonError) {
                console.error("Reçu du HTML au lieu de JSON:", text.substring(0, 100));
                throw new Error("PERMISSION_DENIED");
            }
        } catch (e) {
            console.error(e);
            setSyncStatus('error');
            loadMsg.style.display = 'none';
            errBox.style.display = 'block';
            if (e.message === "PERMISSION_DENIED" || e.message.includes("Unexpected token")) {
                document.getElementById('error-title').textContent = "🔒 Accès Refusé";
                document.getElementById('error-desc').innerHTML = "Le script Google doit être accessible à <b>'Tout le monde'</b>. Vérifiez les autorisations de déploiement.";
            } else {
                document.getElementById('error-title').textContent = "📡 Hors ligne";
                document.getElementById('error-desc').textContent = "Impossible de joindre le serveur. Vérifiez votre connexion.";
            }
        }
    }

    function scheduleSave() {
        setSyncStatus('syncing');
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveData, 1200);
    }

    async function saveData() {
        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            setSyncStatus('synced');
        } catch (e) {
            console.error("Erreur de sauvegarde:", e);
            setSyncStatus('error');
            showToast("⚠️ Erreur de sauvegarde");
        }
    }

    // --- GETTERS ---
    function getActiveFolder() {
        return data.find(f => f.id === activeFolderId);
    }

    function getActivePart() {
        const folder = getActiveFolder();
        return folder ? folder.parts.find(p => p.id === activePartId) : null;
    }

    // --- RENDER FOLDERS ---
    function renderFolders() {
        const list = document.getElementById('folders-list');
        list.innerHTML = '';
        if (!data || data.length === 0) {
            list.innerHTML = '<div style="text-align:center; opacity:0.4; padding:40px 0; font-size:0.95rem;">Aucun projet<br><span style="font-size:0.8rem">Appuyez sur + pour commencer</span></div>';
            return;
        }
        data.forEach(folder => {
            const card = document.createElement('div');
            card.className = 'folder-card';
            const partCount = folder.parts ? folder.parts.length : 0;
            card.innerHTML = `
                <div class="folder-info" style="flex:1; cursor:pointer" onclick="openFolder('${folder.id}')">
                    <h3>${folder.name}</h3>
                    <span>${partCount} morceau${partCount !== 1 ? 'x' : ''}</span>
                </div>
                <button class="btn-danger" style="width:36px; height:36px; padding:0; font-size:1rem; margin-left:10px;" onclick="deleteFolder('${folder.id}')">🗑</button>
            `;
            list.appendChild(card);
        });
    }

    // --- FOLDER ACTIONS ---
    function openFolder(folderId) {
        activeFolderId = folderId;
        const folder = getActiveFolder();
        document.getElementById('folder-title-display').textContent = folder.name;
        showScreen('screen-folder');
        renderParts();
    }

    function createFolder() {
        const name = document.getElementById('input-folder-name').value.trim();
        if (!name) { showToast("Entrez un nom de projet"); return; }
        const newFolder = { id: generateId(), name, parts: [] };
        data.push(newFolder);
        document.getElementById('input-folder-name').value = '';
        closeModals();
        renderFolders();
        scheduleSave();
        showToast(`✅ "${name}" créé`);
    }

    function deleteFolder(folderId) {
        const folder = data.find(f => f.id === folderId);
        if (!folder) return;
        if (!confirm(`Supprimer "${folder.name}" et tous ses morceaux ?`)) return;
        data = data.filter(f => f.id !== folderId);
        renderFolders();
        scheduleSave();
        showToast("🗑 Projet supprimé");
    }

    // --- RENDER PARTS ---
    function renderParts() {
        const list = document.getElementById('parts-list');
        list.innerHTML = '';
        const folder = getActiveFolder();
        if (!folder) return;
        if (!folder.parts || folder.parts.length === 0) {
            list.innerHTML = '<div style="text-align:center; opacity:0.4; padding:40px 0; font-size:0.95rem;">Aucun morceau<br><span style="font-size:0.8rem">Appuyez sur + pour en ajouter</span></div>';
            return;
        }
        folder.parts.forEach(part => {
            const card = document.createElement('div');
            card.className = 'part-card';
            const ruleCount = part.rules ? part.rules.length : 0;
            card.innerHTML = `
                <div style="flex:1; cursor:pointer" onclick="openPart('${part.id}')">
                    <div style="font-size:1.1rem; font-weight:700; margin-bottom:4px;">${part.name}</div>
                    <div style="color:var(--text-dim); font-size:0.9rem;">Rang ${part.count || 0} · ${ruleCount} règle${ruleCount !== 1 ? 's' : ''}</div>
                </div>
                <button class="btn-danger" style="width:36px; height:36px; padding:0; font-size:1rem; margin-left:10px;" onclick="deletePart('${part.id}')">🗑</button>
            `;
            list.appendChild(card);
        });
    }

    // --- PART ACTIONS ---
    function openPart(partId) {
        activePartId = partId;
        const folder = getActiveFolder();
        const part = getActivePart();
        document.getElementById('counter-folder-name').textContent = folder.name.toUpperCase();
        document.getElementById('counter-part-name').textContent = part.name;
        document.getElementById('counter-display').textContent = part.count || 0;
        showScreen('screen-counter');
        renderSatellites();
    }

    function createPart() {
        const name = document.getElementById('input-part-name').value.trim();
        if (!name) { showToast("Entrez un nom"); return; }
        const folder = getActiveFolder();
        if (!folder.parts) folder.parts = [];
        const newPart = { id: generateId(), name, count: 0, rules: [] };
        folder.parts.push(newPart);
        document.getElementById('input-part-name').value = '';
        closeModals();
        renderParts();
        scheduleSave();
        showToast(`✅ "${name}" ajouté`);
    }

    function deletePart(partId) {
        const folder = getActiveFolder();
        const part = folder.parts.find(p => p.id === partId);
        if (!part) return;
        if (!confirm(`Supprimer "${part.name}" ?`)) return;
        folder.parts = folder.parts.filter(p => p.id !== partId);
        renderParts();
        scheduleSave();
        showToast("🗑 Morceau supprimé");
    }

    // --- COUNTER ---
    function increment() {
        const part = getActivePart();
        if (!part) return;
        part.count = (part.count || 0) + 1;
        document.getElementById('counter-display').textContent = part.count;
        checkRules(part);
        renderSatellites();
        scheduleSave();
    }

    function decrement() {
        const part = getActivePart();
        if (!part) return;
        if (part.count <= 0) { showToast("Déjà à 0 !"); return; }
        part.count = part.count - 1;
        document.getElementById('counter-display').textContent = part.count;
        renderSatellites();
        scheduleSave();
    }

    // --- RULES ---
    function addRule() {
        const type = document.getElementById('input-rule-type').value;
        const val = parseInt(document.getElementById('input-rule-val').value);
        const name = document.getElementById('input-rule-name').value.trim();
        if (!val || val <= 0 || !name) { showToast("Remplissez tous les champs"); return; }
        const part = getActivePart();
        if (!part.rules) part.rules = [];
        part.rules.push({ id: generateId(), type, val, name });
        document.getElementById('input-rule-val').value = '';
        document.getElementById('input-rule-name').value = '';
        renderRulesPreview();
        renderSatellites();
        scheduleSave();
        showToast(`✅ Règle "${name}" ajoutée`);
    }

    function deleteRule(ruleId) {
        const part = getActivePart();
        part.rules = part.rules.filter(r => r.id !== ruleId);
        renderRulesPreview();
        renderSatellites();
        scheduleSave();
    }

    function renderRulesPreview() {
        const container = document.getElementById('rules-list-preview');
        container.innerHTML = '';
        const part = getActivePart();
        if (!part || !part.rules || part.rules.length === 0) {
            container.innerHTML = '<div style="opacity:0.4; font-size:0.85rem; text-align:center; padding:10px">Aucune règle</div>';
            return;
        }
        part.rules.forEach(rule => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);';
            const typeLabel = rule.type === 'modulo' ? `tous les ${rule.val} rangs` : `au rang ${rule.val}`;
            row.innerHTML = `
                <div>
                    <div style="font-weight:600; font-size:0.9rem;">${rule.name}</div>
                    <div style="opacity:0.5; font-size:0.8rem;">${typeLabel}</div>
                </div>
                <button class="btn-danger" style="width:30px; height:30px; padding:0; font-size:0.8rem;" onclick="deleteRule('${rule.id}')">✕</button>
            `;
            container.appendChild(row);
        });
    }

    function checkRules(part) {
        if (!part.rules || part.rules.length === 0) return;
        part.rules.forEach(rule => {
            let triggered = false;
            if (rule.type === 'modulo' && part.count % rule.val === 0) triggered = true;
            if (rule.type === 'target' && part.count === rule.val) triggered = true;
            if (triggered) triggerAlert(rule.name);
        });
    }

    function triggerAlert(message) {
        const flash = document.getElementById('flash-alert');
        document.getElementById('flash-message').textContent = message;
        flash.style.display = 'flex';
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    // --- SATELLITES RENDER ---
    function renderSatellites() {
        const area = document.getElementById('satellites-area');
        area.innerHTML = '';
        const part = getActivePart();
        if (!part || !part.rules || part.rules.length === 0) return;
        
        part.rules.forEach(rule => {
            const row = document.createElement('div');
            row.className = 'satellite-row';
            
            let progress = 0;
            let leftText = rule.name;
            let rightText = '';
            let isAlert = false;

            if (rule.type === 'modulo') {
                const current = part.count % rule.val;
                const remaining = current === 0 && part.count > 0 ? 0 : rule.val - current;
                progress = (current / rule.val) * 100;
                isAlert = remaining === 0;
                rightText = isAlert ? '✨ Maintenant !' : `dans ${remaining} rang${remaining > 1 ? 's' : ''}`;
                if (isAlert) progress = 100;
            } else if (rule.type === 'target') {
                const done = part.count >= rule.val;
                progress = done ? 100 : (part.count / rule.val) * 100;
                isAlert = part.count === rule.val;
                rightText = done ? '✅ Fait' : `rang ${rule.val}`;
            }

            row.innerHTML = `
                <div class="progress-bar-bg ${isAlert ? 'alert' : ''}" style="width:${progress}%"></div>
                <div class="satellite-content">
                    <span>${leftText}</span>
                    <span>${rightText}</span>
                </div>
            `;
            area.appendChild(row);
        });
    }

    // --- DUPLICATION ---
    function openDuplicateModal() {
        const part = getActivePart();
        if (!part) return;
        const suggestedName = part.name.includes('Gauche') 
            ? part.name.replace('Gauche', 'Droit') 
            : part.name.includes('Droit') 
            ? part.name.replace('Droit', 'Gauche') 
            : part.name + ' (copie)';
        document.getElementById('input-duplicate-name').value = suggestedName;
        openModal('modal-duplicate-part');
    }

    function executeDuplication() {
        const newName = document.getElementById('input-duplicate-name').value.trim();
        if (!newName) { showToast("Entrez un nom"); return; }
        const part = getActivePart();
        const folder = getActiveFolder();
        const newPart = {
            id: generateId(),
            name: newName,
            count: 0,
            rules: part.rules ? part.rules.map(r => ({ ...r, id: generateId() })) : []
        };
        folder.parts.push(newPart);
        closeModals();
        renderParts();
        scheduleSave();
        showToast(`👯 "${newName}" créé avec ${newPart.rules.length} règle${newPart.rules.length !== 1 ? 's' : ''}`);
    }

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', fetchData);

    // Fermer les modals en cliquant sur l'overlay
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', function(e) {
            if (e.target === this) closeModals();
        });
    });

    // Valider avec Enter dans les inputs
    document.getElementById('input-folder-name').addEventListener('keydown', e => { if (e.key === 'Enter') createFolder(); });
    document.getElementById('input-part-name').addEventListener('keydown', e => { if (e.key === 'Enter') createPart(); });
</script>
</body>
</html>
